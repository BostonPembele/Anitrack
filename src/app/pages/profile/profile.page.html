<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>My Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div style="display:flex; flex-direction:column; align-items:center; padding: 32px 16px 16px">
    <div style="width:80px; height:80px; border-radius:50%; background:var(--ion-color-primary); display:flex; align-items:center; justify-content:center">
      <ion-icon name="tv-outline" style="font-size:36px; color:white"></ion-icon>
    </div>
    <h2 style="margin-top:12px">My Anime Stats</h2>
  </div>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Overview</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:16px">

        <div style="display:flex; flex-direction:column; align-items:center; padding:16px; background:var(--ion-color-light); border-radius:12px">
          <ion-icon name="stats-chart-outline" style="font-size:28px; color:var(--ion-color-primary)"></ion-icon>
          <h2 style="margin:8px 0 4px; font-size:28px; font-weight:700">{{ stats.total }}</h2>
          <ion-label style="font-size:12px; color:var(--ion-color-medium)">Total Anime</ion-label>
        </div>

        <div style="display:flex; flex-direction:column; align-items:center; padding:16px; background:var(--ion-color-light); border-radius:12px">
          <ion-icon name="time-outline" style="font-size:28px; color:var(--ion-color-warning)"></ion-icon>
          <h2 style="margin:8px 0 4px; font-size:28px; font-weight:700">{{ stats.episodesWatched }}</h2>
          <ion-label style="font-size:12px; color:var(--ion-color-medium)">Episodes Watched</ion-label>
        </div>

      </div>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Breakdown</ion-card-title>
    </ion-card-header>
    <ion-card-content>

      <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--ion-color-light)">
        <div style="display:flex; align-items:center; gap:12px">
          <ion-icon name="tv-outline" style="font-size:22px; color:var(--ion-color-primary)"></ion-icon>
          <ion-label>Watching</ion-label>
        </div>
        <h3 style="font-weight:700; color:var(--ion-color-primary)">{{ stats.watching }}</h3>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--ion-color-light)">
        <div style="display:flex; align-items:center; gap:12px">
          <ion-icon name="bookmark-outline" style="font-size:22px; color:var(--ion-color-warning)"></ion-icon>
          <ion-label>Plan to Watch</ion-label>
        </div>
        <h3 style="font-weight:700; color:var(--ion-color-warning)">{{ stats.planned }}</h3>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 0">
        <div style="display:flex; align-items:center; gap:12px">
          <ion-icon name="checkmark-circle-outline" style="font-size:22px; color:var(--ion-color-success)"></ion-icon>
          <ion-label>Completed</ion-label>
        </div>
        <h3 style="font-weight:700; color:var(--ion-color-success)">{{ stats.completed }}</h3>
      </div>

    </ion-card-content>
  </ion-card>

</ion-content>
